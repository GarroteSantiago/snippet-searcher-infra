# Único punto de entrada. Incluido en el bloque http de nginx.conf.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Respeta el X-Correlation-Id del cliente si viene; si no, usa el id del request de NGINX
map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ''      $request_id;
}

server {
    listen 80;
    server_name _;

    # API: /api/x -> snippet-service/x (incluye el WebSocket de ejecución en /api/ws/...)
    location /api/ {
        proxy_pass http://snippet-service:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $correlation_id;
        proxy_read_timeout 300s;
    }

    # UI: por ahora una página provisoria; la reemplaza el build de printscript-ui
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
