# Construye los servicios desde los repos clonados al lado de este:
#   ../snippet-service  ../permission-service  ../printscript-runner
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
services:
  snippet-service:
    image: snippet-searcher/snippet-service:local
    build: ../snippet-service

  permission-service:
    image: snippet-searcher/permission-service:local
    build: ../permission-service

  printscript-runner:
    image: snippet-searcher/printscript-runner:local
    build: ../printscript-runner
